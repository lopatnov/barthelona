[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "barthelona"
version = "0.0.1"
description = "Meta-Agentic Scrum system that creates and edits multi-file assembly projects (NASM, GAS, FASM, MASM) from natural-language requests"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Oleksandr Lopatnov" }]
requires-python = ">=3.13,<3.14"
# Single source of truth for dependencies. Installs use the hash-locked files in
# requirements/*.{win,linux}.lock (regenerate with scripts/lock.ps1). See docs/adr/D-031.
dependencies = [
    # Orchestration
    "langgraph>=1.2.15,<1.3",
    "langgraph-checkpoint-sqlite>=3.1.2,<4",
    "langchain-core>=1.6.10,<2",
    # Data models and config
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    "ruamel.yaml>=0.19,<0.20",
    "jinja2>=3.1.6,<4",
    "orjson>=3.13,<4",
    # UI and CLI
    "streamlit>=1.65,<2",
    "typer>=0.27,<0.28",
    "rich>=15,<16",
    # LLM providers (thin own gateway; no LiteLLM, see D-012)
    "openai>=3.29,<4",
    "anthropic>=1.13,<2",
    "google-genai>=2.30,<3",
    "httpx>=0.28,<0.29",
    # Topology validation
    "networkx>=3.7,<4",
    # Verification: emulator, disassembler, object files
    "unicorn>=2.1.4,<2.2",
    "capstone>=5.0.9,<6",
    "pyelftools>=0.33,<0.34",
    "lief>=1.0,<1.1",
    "pefile>=2024.8.26",
    # Knowledge ingestion
    "beautifulsoup4>=4.15,<5",
    "lxml>=6.1,<7",
    "tokenizers>=0.23,<0.24",
    # Misc
    "platformdirs>=4.13,<5",
    "psutil>=7.2.2,<8",
]

[project.optional-dependencies]
# Phase 3: Qdrant hybrid retrieval (only enabled if the retrieval eval shows a gain)
kb = [
    "qdrant-client>=1.19.1,<1.20",
    "fastembed>=0.9,<0.10",
    "mmh3>=5.3,<6",
]
# Optional OpenTelemetry export to an external Arize Phoenix instance
obs = [
    "opentelemetry-sdk>=1.45,<2",
    "openinference-instrumentation-langchain>=0.1.79,<0.2",
]
# Fallback parser for the MASM PDF (prefer the cpp-docs Markdown sources)
ingest-pdf = ["pypdf>=6.20,<7"]
# Emulator child package (D-056): V3 static lint (capstone) + V4 dynamic checks (unicorn)
# Note: unicorn and capstone are already in main dependencies; this extra is a marker
emulator = []
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.8",
    "hypothesis>=6.169",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "uv>=0.12",  # only for scripts/lock.ps1
]

[tool.hatch.build.targets.wheel]
packages = ["src/barthelona"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [".reference", ".agents", "asm_doc", "workspaces", "var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "ASYNC", "C901", "PLR0912", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH", "C901", "PLR0912", "PLR0915"]
# Dev-time agent helpers (.claude/skills) are outside the size rules.
".claude/**" = ["C901", "PLR0912", "PLR0915"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["barthelona"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
norecursedirs = [".*", "asm_doc", "workspaces", "var", "docs", "requirements", "build", "dist"]
addopts = "-ra --strict-markers -m 'not wsl and not docker and not llm and not slow'"
asyncio_mode = "auto"
timeout = 120
markers = [
    "wsl: needs the WSL VM, docker and the toolchain images",
    "docker: needs a running bart-tc container on this host (CI docker job, any Linux with Docker)",
    "llm: calls a real LLM endpoint (local or cloud)",
    "slow: takes more than a few seconds",
]
