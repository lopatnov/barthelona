<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1020" width="1300" height="1020" role="img" aria-label="After every apply the tamper gate runs, then levels V0 to V6 are climbed cheapest first; oracles decide, a failure skips later levels and triggers a V7 trace for the fixer." font-family="Arial, Helvetica, sans-serif">
<title>6. Verification ladder and gates</title>
