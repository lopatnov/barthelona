<text x="1080" y="185.55" font-size="13" fill="#1a1a1a" text-anchor="middle">Every loop declares bounds (iterations, time, tokens, money)</text>
<text x="1080" y="202.55" font-size="13" fill="#1a1a1a" text-anchor="middle">and every exit has a StopReason (inv. 6). Code travels in FILE /</text>
<text x="1080" y="219.55" font-size="13" fill="#1a1a1a" text-anchor="middle">SEARCH-REPLACE / SYMBOL envelopes, never JSON (inv. 5).</text>
