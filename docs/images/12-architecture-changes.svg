<polyline points="1080,522 1080,550" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="640,718 670,718" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ah)"/>
