<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 930" width="1400" height="930" role="img" aria-label="Top: a node's tool run goes through an async executor session and a transport to the WSL agent, which runs argv lists in the locked-down bart-tc or bart-run containers. Bottom: every side-effecting node writes effect, then events, then checkpoint, so a crash replays safely." font-family="Arial, Helvetica, sans-serif">
<title>7. Execution, sandbox and crash consistency</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#37474f"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 Z" fill="#37474f"/></marker></defs>
<rect x="0" y="0" width="1400" height="930" fill="#ffffff"/>
<text x="24" y="36" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="bold">7. Execution, sandbox and crash consistency</text>
<text x="24" y="58" font-size="13" fill="#455a64" text-anchor="start">Delivered: executors in Phase 0, bart-tc / bart-run images with the Phase 0 work, crash spike in Phase 1 (§7, §13.4, D-043, D-044)</text>
<rect x="760" y="86" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/><text x="788" y="97" font-size="12" fill="#1a1a1a" text-anchor="start">Exists on main</text><rect x="900.4615384615385" y="86" width="22" height="14" rx="3" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.5"/><text x="928.462" y="97" font-size="12" fill="#1a1a1a" text-anchor="start">In progress (Phase 0)</text><rect x="1086.1538461538462" y="86" width="22" height="14" rx="3" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/><text x="1114.15" y="97" font-size="12" fill="#1a1a1a" text-anchor="start">Planned</text><rect x="1181.3846153846155" y="86" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/><text x="1209.38" y="97" font-size="12" fill="#1a1a1a" text-anchor="start">Rule: never</text>
<rect x="30" y="202" width="160" height="56" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="1.8"/>
<text x="110" y="226.05" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Node needs</text>
<text x="110" y="243.05" font-size="13" fill="#1a1a1a" text-anchor="middle">a tool run</text>
<rect x="250" y="194" width="210" height="72" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.8"/>
<text x="355" y="217.55" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Executor Session</text>
<text x="355" y="234.55" font-size="13" fill="#1a1a1a" text-anchor="middle">(async)</text>
<text x="355" y="251.55" font-size="13" fill="#1a1a1a" text-anchor="middle">request ids, own work dir</text>
<polygon points="558,202 642,202 670,230 642,258 558,258 530,230" fill="#ffffff" stroke="#37474f" stroke-width="1.8" stroke-linejoin="round"/>
<text x="600" y="234.55" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">transport</text>
<rect x="770" y="150" width="220" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.8"/>
<text x="880" y="174.05" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">WslTransport</text>
<text x="880" y="191.05" font-size="13" fill="#1a1a1a" text-anchor="middle">one long-lived wsl.exe pipe</text>
<rect x="770" y="254" width="220" height="56" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.8"/>
<text x="880" y="278.05" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">LocalTransport</text>
<text x="880" y="295.05" font-size="13" fill="#1a1a1a" text-anchor="middle">same agent, Linux host</text>
<rect x="1090" y="194" width="290" height="72" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.8"/>
<text x="1235" y="217.55" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Agent (stdlib python3)</text>
<text x="1235" y="234.55" font-size="13" fill="#1a1a1a" text-anchor="middle">argv lists only, allowlist, path fence,</text>
<text x="1235" y="251.55" font-size="13" fill="#1a1a1a" text-anchor="middle">timeouts, output caps</text>
<rect x="760" y="360" width="300" height="76" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.8"/>
<text x="910" y="385.55" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">bart-tc exec</text>
<text x="910" y="402.55" font-size="13" fill="#1a1a1a" text-anchor="middle">assemble, link</text>
<text x="910" y="419.55" font-size="13" fill="#1a1a1a" text-anchor="middle">--network none, read-only, non-root</text>
<rect x="1080" y="360" width="300" height="76" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.8"/>
<text x="1230" y="385.55" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">bart-run, fresh per test batch</text>
<text x="1230" y="402.55" font-size="13" fill="#1a1a1a" text-anchor="middle">cap-drop ALL, pids 64, 256 MB,</text>
<text x="1230" y="419.55" font-size="13" fill="#1a1a1a" text-anchor="middle">timeout -s KILL, no network</text>
<rect x="30" y="360" width="640" height="76" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.8"/>
<text x="350" y="394.05" font-size="13" fill="#1a1a1a" text-anchor="middle">Never: generated code on Windows or in a bare WSL shell, a docker socket mount,</text>
<text x="350" y="411.05" font-size="13" fill="#1a1a1a" text-anchor="middle">secrets inside containers, shell=True, or LLM access to a shell</text>
<rect x="30" y="520" width="260" height="44" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="1.8"/>
<text x="160" y="546.55" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Node</text>
<rect x="390" y="520" width="260" height="44" rx="6" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.8"/>
<text x="520" y="546.55" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Workspace git + .barthelona</text>
<rect x="750" y="520" width="260" height="44" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.8"/>
<text x="880" y="546.55" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">app.sqlite</text>
<rect x="1110" y="520" width="260" height="44" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="1.8"/>
<text x="1240" y="546.55" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">LangGraph checkpoint</text>
<rect x="30" y="776" width="1340" height="32" rx="6" fill="#ffffff" stroke="#37474f" stroke-width="1.8"/>
<text x="700" y="796.55" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Crash between any two steps: the node re-runs and every step is a no-op.</text>
<rect x="30" y="818" width="980" height="32" rx="6" fill="#ffffff" stroke="#37474f" stroke-width="1.8"/>
<text x="520" y="838.55" font-size="13" fill="#1a1a1a" text-anchor="middle">On resume the gateway reuses the recorded response for the same node, attempt and prompt hash.</text>
<rect x="30" y="860" width="980" height="32" rx="6" fill="#ffffff" stroke="#37474f" stroke-width="1.8"/>
<text x="520" y="880.55" font-size="13" fill="#1a1a1a" text-anchor="middle">gate_requested, increment and stop events are flushed before the checkpoint.</text>
