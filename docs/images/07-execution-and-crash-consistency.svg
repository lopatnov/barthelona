<text x="734" y="274" font-size="12" fill="#263238" text-anchor="middle">Linux CI</text>
<rect x="1022.92" y="210" width="64.1538" height="15" fill="#ffffff" fill-opacity="0.92"/>
<text x="1055" y="222" font-size="12" fill="#263238" text-anchor="middle">JSON lines</text>
<rect x="990.015" y="322" width="69.9692" height="15" fill="#ffffff" fill-opacity="0.92"/>
<text x="1025" y="334" font-size="12" fill="#263238" text-anchor="middle">docker exec</text>
<rect x="1252.85" y="305" width="64.1538" height="15" fill="#ffffff" fill-opacity="0.92"/>
<text x="1314" y="317" font-size="12" fill="#263238" text-anchor="end">docker run</text>
<text x="24" y="500" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="bold">Write order in every side-effecting node (crash consistency, D-044)</text>
<text x="172" y="612" font-size="13" fill="#1a1a1a" text-anchor="start">1. effect (idempotent, keyed by run, task, attempt, node)</text>
<text x="172" y="668" font-size="13" fill="#1a1a1a" text-anchor="start">2. events with dedupe_key (replay is a no-op)</text>
<text x="172" y="724" font-size="13" fill="#1a1a1a" text-anchor="start">3. checkpoint (paths and hashes only)</text>
</svg>
