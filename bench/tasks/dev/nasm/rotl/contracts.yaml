version: 1
target:
  preset: linux-x64-nasm
  dialect: nasm
  arch: x86-64
  os: linux
  abi: sysv64
  obj_format: elf64
  link: ld
  run_env: docker-native
symbols:
  rotl:
    name: rotl
    kind: func
    module: src/rotl.asm
    inputs:
      - {reg: rdi, type: u64}
      - {reg: rsi, type: u64}
    outputs:
      - {reg: rax, type: u64}
