# Checks hello-barthelona with barthelona's emulator: NASM assembles the source and every golden test must match.
# Generated by barthelona; the workflow is yours to edit, regenerating it overwrites your changes.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The barthelona commit that checks this project. Bump it deliberately.
  BARTHELONA_REF: b0cf4ab780bac93a4fbd15753a262a74502c8010

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lopatnov/barthelona
          ref: ${{ env.BARTHELONA_REF }}
          path: .barthelona-tool
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install barthelona from its hash-locked runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --no-deps \
            -r .barthelona-tool/requirements/runtime.linux.lock
          python -m pip install --disable-pip-version-check --no-deps -e .barthelona-tool
      - name: Install nasm
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm
      - name: Assemble and run the golden tests in the emulator
        run: python -m barthelona check src/hello.asm --tests tests/golden.json
