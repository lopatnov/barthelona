# SonarCloud automatic analysis settings (read from the default branch).
# Vendored manuals, the brainstorm archive and generated files are not our code: analyzing them
# buried the real findings under ~9,300 HTML issues (issue #14).
sonar.sources=src,scripts,.claude/hooks,config,docker
sonar.tests=tests
sonar.exclusions=asm_doc/**,docs/archive/**,.agents/**,.codex/agents/**,requirements/**,.reference/**,workspaces/**,var/**
sonar.python.version=3.13
