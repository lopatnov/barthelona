# Quality gates on every push and pull request (roadmap F-16, issue #15).
# Mirrors the local `verify` skill; agents merge their own PRs only after these checks pass (D-035).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install NASM (the ABI corpus and the behavior gate assemble real programs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm
      - name: Install the hash-locked dev dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/dev.linux.lock
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m pytest
      - run: python scripts/check_file_sizes.py
      - run: python scripts/sync_agent_configs.py --check
      - run: python scripts/deps_fingerprint.py --check

  docker:
    # Builds the sandbox images and runs the smoke test (roadmap Phase 0, Execution).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/docker-smoke.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the hash-locked dev dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/dev.linux.lock
          python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Start bart-tc with the cache root mounted (D-043 LocalTransport)
        run: |
          cache="$HOME/.cache/barthelona"
          mkdir -p "$cache"
          docker run -d --name bart-tc --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:size=16m \
            --user "$(id -u):$(id -g)" -v "$cache:$cache" bart-tc
      - name: Toolchain tests through the local agent
        run: python -m pytest -m docker

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=style

  powershell:
    # windows-latest has Windows PowerShell 5.1, which every script must support.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          $settings = Import-PowerShellDataFile .\PSScriptAnalyzerSettings.psd1
          # Guard hooks are owner-only; their two open findings are tracked in issue #22.
          $hookSettings = $settings.Clone()
          $hookSettings.ExcludeRules = $settings.ExcludeRules + @('PSAvoidUsingEmptyCatchBlock', 'PSUseSingularNouns')
          $found = git ls-files '*.ps1' '*.psm1' '*.psd1' | ForEach-Object {
            $s = if ($_ -like '.claude/hooks/*') { $hookSettings } else { $settings }
            Invoke-ScriptAnalyzer -Path $_ -Settings $s
          }
          $found | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 250
          if ($found) { exit 1 }

  templates:
    # The CI/CD templates the scaffolder emits (D-048) must pass actionlint when rendered.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the hash-locked runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/runtime.linux.lock
          python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Render the templates for a sample project
        run: python scripts/render_ci_templates.py rendered
      - name: actionlint
        working-directory: rendered
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color ./*/.github/workflows/*.yml

  yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: yamllint
        run: git ls-files -z '*.yml' '*.yaml' | xargs -0 yamllint --strict
