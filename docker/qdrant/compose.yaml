# Barthelona's own Qdrant (ADR D-034). Run inside WSL from the repo root:
#   docker compose -f docker/qdrant/compose.yaml up -d
#   docker compose -f docker/qdrant/compose.yaml down        # keeps the data volume
# Separate from the owner's other Qdrant (qdrant-db on 6333): own project name,
# container, named volume and host ports. Ports bind to loopback only.
name: barthelona

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: barthelona-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6343:6333"   # REST
      - "127.0.0.1:6344:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage   # named volume, never a /mnt/c bind mount
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  qdrant_storage:
    name: barthelona_qdrant_storage
