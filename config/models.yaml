default_profile: hybrid

# Dollar budgets are OPTIONAL. null = no cap, but every call is still metered per run, sprint and provider.
# Time and token limits are not optional: an empty UI field means the profile default (limits_by_profile).
budget:
  run_usd: null
  monthly_usd: null
  per_provider_usd: {}             # e.g. {anthropic: 10, openai: 5}
  warn_at: 0.8                     # fraction of a cap at which the UI warns
  on_exhausted: ask                # ask | fallback_local | stop  (G5 gate when "ask")
  # Time and token limits per profile (always applied; the UI may lower or raise them per run).
  limits_by_profile:
    local-only: {wall_s: 14400, tokens: 3000000}
    hybrid: {wall_s: 14400, tokens: 3000000}
    cloud: {wall_s: 7200, tokens: 2000000}
  # Reservation for a capped call: input rate x prompt tokens + output rate x max_tokens (+ cache-write rate),
  # each at the highest tier the request can reach (long_context, peak); settlement uses the tier that applied.

# Resilience (docs/architecture.md §16.6). Error classes are mapped per provider in code, by error
# type/code/message substring, never by HTTP status alone.
resilience:
  retry:                           # transient errors only: rate limit, overloaded, 5xx, timeouts
    max_attempts: 3
    base_delay_s: 1.0
    max_delay_s: 30.0
    jitter: full
    honor_retry_after: true        # Retry-After is a minimum, jitter is added on top
  circuit_breaker:
    transient: {failures_to_open: 3, window_s: 120, cooldown_s: 60}
    terminal: {cooldown_s: 1800}   # no credit / quota / spend limit / bad key: skip provider, re-probe later
  output_repair:
    max_repairs: 2                 # invalid JSON or schema: feed back errors, then next model in the chain
  streaming_required_above_max_tokens: 16000   # stream long outputs and long reasoning to avoid HTTP timeouts
