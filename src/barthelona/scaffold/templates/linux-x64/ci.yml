# Verifies __SLUG__ with barthelona's verification ladder inside its Docker sandbox (D-048).
# Generated by barthelona; the workflow is yours to edit, regenerating it overwrites your changes.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The barthelona commit that verifies this project. Bump it deliberately.
  BARTHELONA_REF: __BARTHELONA_REF__

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lopatnov/barthelona
          ref: ${{ env.BARTHELONA_REF }}
          path: .barthelona-tool
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install barthelona from its hash-locked runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --no-deps \
            -r .barthelona-tool/requirements/runtime.linux.lock
          python -m pip install --disable-pip-version-check --no-deps -e .barthelona-tool
      - name: Build the sandbox images
        run: |
          docker build -q -t bart-tc .barthelona-tool/docker/toolchain
          docker build -q -t bart-run .barthelona-tool/docker/runner
      - name: Start bart-tc with the cache root mounted
        run: |
          cache="$HOME/.cache/barthelona"
          mkdir -p "$cache"
          docker run -d --name bart-tc --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:size=16m \
            --user "$(id -u):$(id -g)" -v "$cache:$cache" bart-tc
      - name: barthelona verify
        # verify exits 1 while V3 and V4 have no check (barthelona issue #123), so the next step reads
        # the report instead of the exit code.
        run: |
          python -m barthelona verify __SOURCE_DIR__ --dialect __DIALECT__ --level V6 --transport local \
            --run-id ci --contracts __CONTRACTS__ --tests __TESTS__ --json > ladder.json || true
      - name: The required levels pass
        run: |
          for level in __REQUIRED_LEVELS__; do
            jq -e --arg level "$level" 'any(.levels[]; .level == $level and .status == "pass")' ladder.json \
              > /dev/null || { echo "required level $level did not pass"; exit 1; }
          done
          jq -e 'all(.levels[]; .status != "fail")' ladder.json > /dev/null
