# Builds the __SLUG__ binary on GitHub and publishes it as a release when a v* tag is pushed (D-048).
# Generated by barthelona; the workflow is yours to edit, regenerating it overwrites your changes.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a green ci run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --status success --json databaseId --jq length)"
          test "$passed" -gt 0 || { echo "no successful ci run for $GITHUB_SHA"; exit 1; }
      - name: Install __ASSEMBLER_PACKAGE__
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends __ASSEMBLER_PACKAGE__
      - name: Assemble and link
        run: |
          mkdir build
          __BUILD_COMMANDS__
      - name: Check the artifact without running it
        run: |
          file_info="$(file build/__ARTIFACT__)"
          echo "$file_info"
          echo "$file_info" | grep -q "ELF 64-bit LSB executable, x86-64"
          cd build
          sha256sum __ARTIFACT__ | tee __ARTIFACT__.sha256
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" build/__ARTIFACT__ build/__ARTIFACT__.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "__SLUG__ $TAG" --generate-notes
